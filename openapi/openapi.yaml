          $ref: "#/components/schemas/UserAccountClass"
        subtype:
          $ref: "#/components/schemas/AccountSubtype"
        currency:
          $ref: "#/components/schemas/Currency"
        openingBalance:
          $ref: "#/components/schemas/DecimalAmount"
        openingBalanceDate:
          type: string
          format: date
        idempotencyKey:
          type: string
          format: uuid
    UpdateAccountRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        currency:
          $ref: "#/components/schemas/Currency"
        archived:
          type: boolean
    CategoryListResponse:
      type: object
      additionalProperties: false
      required: [categories]
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
    Category:
      type: object
      additionalProperties: false
