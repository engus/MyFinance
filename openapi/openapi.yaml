          $ref: "#/components/schemas/CategoryDirection"
    UpdateCategoryRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        archived:
          type: boolean
    CreateTransactionRequest:
      type: object
      additionalProperties: false
      description: Typed operation contract. Raw journal entries are never accepted from clients.
      required: [type, eventDate, amount, idempotencyKey]
      properties:
        type:
          type: string
          enum: [OPENING_BALANCE, INCOME, EXPENSE, TRANSFER, ASSET_PURCHASE]
        eventDate:
          type: string
          format: date
        amount:
          $ref: "#/components/schemas/PositiveDecimalAmount"
        idempotencyKey:
          type: string
          format: uuid
        description:
          type: string
          minLength: 1
          maxLength: 500
        accountId:
          type: string
          format: uuid
          description: Required for opening balance, income, and expense.
        categoryId:
          type: string
          format: uuid
          description: Required for income and expense.
        sourceAccountId:
          type: string
          format: uuid
          description: Required for transfer and asset purchase.
        destinationAccountId:
          type: string
          format: uuid
          description: Required for transfer and asset purchase.
    TransactionListResponse:
      type: object
      additionalProperties: false
      required: [transactions]
      properties:
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        nextCursor:
          type: string
    Transaction:
      type: object
      additionalProperties: false
      required: [id, type, eventDate, amount, currency, primaryAccountName, status, postedAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/TransactionType"
        eventDate:
          type: string
          format: date
        description:
          type: string
        amount:
          $ref: "#/components/schemas/PositiveDecimalAmount"
        currency:
          $ref: "#/components/schemas/Currency"
        primaryAccountName:
          type: string
        primaryAccountId:
          type: string
          format: uuid
        counterpartyName:
          type: string
        counterpartyAccountId:
          type: string
          format: uuid
        categoryName:
          type: string
        categoryId:
          type: string
          format: uuid
        status:
          type: string
          enum: [POSTED, REVERSED, REVERSAL, REPLACED]
        reversesTransactionId:
          type: string
          format: uuid
        replacesTransactionId:
          type: string
          format: uuid
        postedAt:
          type: string
          format: date-time
    ReversalRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey]
      properties:
        idempotencyKey:
          type: string
          format: uuid
        description:
          type: string
          minLength: 1
          maxLength: 500
    ReplacementRequest:
      type: object
      additionalProperties: false
      required: [reversalIdempotencyKey, operation]
      properties:
        reversalIdempotencyKey:
          type: string
          format: uuid
        operation:
          $ref: "#/components/schemas/CreateTransactionRequest"
    ReplacementResponse:
      type: object
      additionalProperties: false
      required: [reversal, replacement]
      properties:
        reversal:
          $ref: "#/components/schemas/Transaction"
        replacement:
          $ref: "#/components/schemas/Transaction"
    UserAccountClass:
      type: string
      enum: [ASSET, LIABILITY]
    AccountSubtype:
      type: string
      enum: [bank, cash, brokerage, real_estate, vehicle, security, mortgage, loan, other]
    CategoryDirection:
      type: string
      enum: [INCOME, EXPENSE]
    TransactionType:
      type: string
      enum: [OPENING_BALANCE, INCOME, EXPENSE, TRANSFER, ASSET_PURCHASE, REVERSAL]
    Password:
      type: string
      minLength: 12
      maxLength: 128
    DecimalAmount:
      type: string
      pattern: "^-?(0|[1-9][0-9]*)(\\.[0-9]{1,8})?$"
    PositiveDecimalAmount:
      type: string
      pattern: "^(0|[1-9][0-9]*)(\\.[0-9]{1,8})?$"
    ReconciliationMode:
