      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        direction:
          $ref: "#/components/schemas/CategoryDirection"
        archived:
          type: boolean
    CreateCategoryRequest:
      type: object
      additionalProperties: false
      required: [name, direction]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
