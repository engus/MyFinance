      type: string
      enum: [WEEKLY, MONTHLY, QUARTERLY, YEARLY, CUSTOM]
    RecurringIntervalUnit:
      type: string
      enum: [DAYS, WEEKS, MONTHS, YEARS]
    RecurringTemplateStatus:
      type: string
      enum: [ACTIVE, PAUSED]
