      type: string
      enum: [ASSET, LIABILITY]
    AccountSubtype:
      type: string
      enum: [bank, cash, brokerage, real_estate, vehicle, security, mortgage, loan, other]
    CategoryDirection:
      type: string
      enum: [INCOME, EXPENSE]
    TransactionType:
      type: string
      enum:
        [
          OPENING_BALANCE,
          INCOME,
          EXPENSE,
          TRANSFER,
          ASSET_PURCHASE,
          RECONCILIATION,
          REVALUATION,
          REVERSAL,
        ]
