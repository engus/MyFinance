<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #faf8ff;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-md">
<!-- Background Subtle Decoration -->
<div class="fixed inset-0 overflow-hidden pointer-events-none">
<div class="absolute -top-24 -left-24 w-96 h-96 bg-primary opacity-[0.03] rounded-full blur-3xl"></div>
<div class="absolute -bottom-24 -right-24 w-96 h-96 bg-secondary opacity-[0.03] rounded-full blur-3xl"></div>
</div>
<!-- Main Auth Card -->
<main class="relative w-full max-w-md">
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_1px_3px_rgba(15,23,42,0.08)] p-xl border border-outline-variant/30 flex flex-col gap-lg animate-in fade-in slide-in-from-bottom-4 duration-700">
<!-- Logo & Header -->
<div class="text-center space-y-sm">
<div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-primary-container text-on-primary-container mb-sm">
<span class="material-symbols-outlined text-3xl">account_balance_wallet</span>
</div>
<h1 class="font-headline-md text-headline-md text-primary font-bold tracking-tight">MyFinance</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Управление вашими финансами начинается здесь</p>
</div>
<!-- Login Form -->
<form class="space-y-lg" id="authForm" onsubmit="return false;">
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full h-12 pl-12 pr-4 bg-surface border border-outline-variant rounded-lg font-body-md text-body-md focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all placeholder:text-outline/50" id="email" placeholder="example@mail.com" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center px-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Пароль</label>
<a class="font-label-md text-label-md text-primary hover:underline" href="#">Забыли пароль?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full h-12 pl-12 pr-12 bg-surface border border-outline-variant rounded-lg font-body-md text-body-md focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all placeholder:text-outline/50" id="password" placeholder="••••••••" required="" type="password">
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface-variant transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="passIcon">visibility</span>
</button>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-md pt-sm">
<button class="h-12 bg-primary-container text-on-primary hover:bg-primary transition-colors rounded-lg font-body-md text-body-md font-semibold shadow-sm active:scale-[0.98] transition-transform" type="submit">
                        Войти
                    </button>
<div class="relative flex items-center py-sm">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink mx-4 font-label-md text-label-md text-outline">или</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<button class="h-12 bg-transparent border border-outline-variant text-on-surface-variant hover:bg-surface-container-low transition-colors rounded-lg font-body-md text-body-md font-semibold active:scale-[0.98] transition-transform" type="button">
                        Зарегистрироваться
                    </button>
</div>
</form>
<!-- Social Logins (Optional but adds to the high-end feel) -->
<div class="flex justify-center gap-lg pt-sm">
<button class="p-3 rounded-full border border-outline-variant hover:bg-surface-container transition-all hover:border-primary/30" title="Google">
<svg class="w-5 h-5" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="currentColor"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="currentColor"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="currentColor"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z" fill="currentColor"></path>
</svg>
</button>
<button class="p-3 rounded-full border border-outline-variant hover:bg-surface-container transition-all hover:border-primary/30" title="Apple">
<svg class="w-5 h-5" viewBox="0 0 24 24">
<path d="M17.05 20.28c-.96.95-2.18 1.78-3.41 1.78-.36 0-.75-.1-1.12-.1s-.82.1-1.22.1c-1.18 0-2.31-.76-3.26-1.78C6.12 18.25 4.84 15.14 4.84 12.35c0-4.04 2.6-6.15 5.09-6.15.65 0 1.28.16 1.83.43.51.25.96.41 1.4.41s.88-.16 1.4-.41c.57-.27 1.23-.43 1.91-.43 2.15 0 3.86 1.54 4.67 3.49-1.92.93-2.28 3.51-.55 4.79-.8 1.88-1.93 3.71-3.54 5.8zM12.03 5.4c0-2.3 1.88-4.22 4.14-4.28.08 2.22-1.93 4.41-4.14 4.28z" fill="currentColor"></path>
</svg>
</button>
</div>
</div>
<!-- Footer Help -->
<footer class="mt-lg text-center space-x-md">
<a class="font-label-md text-label-md text-outline hover:text-primary transition-colors" href="#">Конфиденциальность</a>
<a class="font-label-md text-label-md text-outline hover:text-primary transition-colors" href="#">Помощь</a>
<a class="font-label-md text-label-md text-outline hover:text-primary transition-colors" href="#">Условия</a>
</footer>
</main>
<script>
        function togglePassword() {
            const passInput = document.getElementById('password');
            const passIcon = document.getElementById('passIcon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                passIcon.innerText = 'visibility_off';
            } else {
                passInput.type = 'password';
                passIcon.innerText = 'visibility';
            }
        }

        // Simple animation on submit
        document.getElementById('authForm').addEventListener('submit', (e) => {
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerText;
            btn.disabled = true;
            btn.innerHTML = '<span class="inline-block animate-spin material-symbols-outlined">progress_activity</span>';

            setTimeout(() => {
                btn.disabled = false;
                btn.innerText = originalText;
                alert('Вход выполнен (демо-режим)');
            }, 1500);
        });
    </script>
</body></html>
