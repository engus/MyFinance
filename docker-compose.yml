name: myfinance

x-postgres-environment: &postgres-environment
  POSTGRES_DB: ${POSTGRES_DB:-myfinance}
  POSTGRES_USER: ${POSTGRES_USER:-myfinance}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myfinance}

x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-development}
  APP_VERSION: ${APP_VERSION:-dev}
  API_PORT: 8080
  DATABASE_URL: postgres://${POSTGRES_USER:-myfinance}:${POSTGRES_PASSWORD:-myfinance}@postgres:5432/${POSTGRES_DB:-myfinance}?sslmode=disable
  LOG_LEVEL: ${LOG_LEVEL:-info}
  SESSION_TTL: ${SESSION_TTL:-720h}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
  TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}

services:
  postgres:
    image: postgres:17.10-alpine3.22
    environment: *postgres-environment
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myfinance} -d ${POSTGRES_DB:-myfinance}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  postgres-test:
    image: postgres:17.10-alpine3.22
    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB:-myfinance_test}
      POSTGRES_USER: ${POSTGRES_USER:-myfinance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myfinance}
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-myfinance} -d ${POSTGRES_TEST_DB:-myfinance_test}",
        ]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    image: migrate/migrate:v4.19.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-myfinance}:${POSTGRES_PASSWORD:-myfinance}@postgres:5432/${POSTGRES_DB:-myfinance}?sslmode=disable
      - up
    restart: "no"

  migrate-test:
    image: migrate/migrate:v4.19.1
    depends_on:
      postgres-test:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-myfinance}:${POSTGRES_PASSWORD:-myfinance}@postgres-test:5432/${POSTGRES_TEST_DB:-myfinance_test}?sslmode=disable
      - up
    restart: "no"

  seed:
    image: postgres:17.10-alpine3.22
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *postgres-environment
      PGPASSWORD: ${POSTGRES_PASSWORD:-myfinance}
    volumes:
      - ./db/seed:/seed:ro
    command:
      - sh
      - -c
      - psql -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -v ON_ERROR_STOP=1 -f /seed/dev.sql
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/go.Dockerfile
      target: development
    environment: *app-environment
    depends_on:
      seed:
        condition: service_completed_successfully
    command: ["go", "run", "./cmd/api"]
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - .:/workspace
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/go.Dockerfile
      target: development
    environment:
      <<: *app-environment
      WORKER_INTERVAL: ${WORKER_INTERVAL:-24h}
    depends_on:
      seed:
        condition: service_completed_successfully
    command: ["go", "run", "./cmd/worker"]
    volumes:
      - .:/workspace
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: development
    environment:
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://api:8080}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    volumes:
      - ./apps/web:/workspace/apps/web
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  adminer:
    image: adminer:5.4.2-standalone
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8081}:8080"
    restart: unless-stopped

volumes:
  postgres-data:
  go-mod-cache:
  go-build-cache:
