openapi: 3.1.0
info:
  title: MyFinance API
  version: 0.2.0
  description: REST contract for the MyFinance personal-finance web application.
servers:
  - url: /api/v1
paths:
  /api/v1/health/live:
    get:
      operationId: getLiveness
      summary: Confirm that the API process is running
      tags: [Health]
      responses:
        "200":
          description: API process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/health/ready:
    get:
      operationId: getReadiness
      summary: Confirm that the API can serve database-backed requests
      tags: [Health]
      responses:
        "200":
          description: API and database are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/register:
    post:
      operationId: register
      summary: Register an identity and create its first browser session
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Identity and session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Authenticate with email and password
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session created because TOTP is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "202":
          description: Password accepted and a one-time TOTP challenge was created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginChallengeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/login/totp:
    post:
      operationId: verifyLoginTOTP
      summary: Complete a password login with an authenticator code
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPLoginRequest"
      responses:
        "200":
          description: Authenticator code accepted and session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/login/recovery:
    post:
      operationId: verifyLoginRecoveryCode
      summary: Complete a password login with a one-time recovery code
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryLoginRequest"
      responses:
        "200":
          description: Recovery code consumed and session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current browser session
      tags: [Authentication]
      responses:
        "204":
          description: Browser session revoked or already absent
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      summary: Return the current authenticated user
      tags: [Authentication]
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/sessions:
    get:
      operationId: listSessions
      summary: List active sessions for the current user
      tags: [Authentication]
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/sessions/{sessionId}:
    delete:
      operationId: revokeSession
      summary: Revoke one active session owned by the current user
      tags: [Authentication]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Session revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/auth/totp/setup:
    post:
      operationId: setupTOTP
      summary: Generate an encrypted pending TOTP credential
      tags: [Authentication]
      responses:
        "201":
          description: Pending TOTP credential created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPSetupResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/totp/confirm:
    post:
      operationId: confirmTOTP
      summary: Confirm pending TOTP and issue one-time recovery codes
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPConfirmRequest"
      responses:
        "200":
          description: TOTP enabled and recovery codes returned once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPConfirmResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/auth/totp/disable:
    post:
      operationId: disableTOTP
      summary: Disable TOTP after password and authenticator verification
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPDisableRequest"
      responses:
        "204":
          description: TOTP and recovery codes removed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/users/me:
    patch:
      operationId: updateProfile
      summary: Update display name or email with password confirmation for email changes
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteAccount
      summary: Permanently delete the user and all owned data after password confirmation
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountRequest"
      responses:
        "204":
          description: User and owned data deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/users/me/password:
    put:
      operationId: changePassword
      summary: Change password and revoke all other sessions
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed and other sessions revoked
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/users/me/settings:
    patch:
      operationId: updateUserSettings
      summary: Update timezone, currencies, and reconciliation preference
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserSettingsRequest"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/onboarding/complete:
    post:
      operationId: completeOnboarding
      summary:
        Save settings, first account, opening balance, and optional recurring income atomically
      tags: [Onboarding]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteOnboardingRequest"
      responses:
        "200":
          description: Onboarding completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteOnboardingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/accounts:
    get:
      operationId: listAccounts
      summary: List owned user accounts with exact ledger balances
      tags: [Cashflow]
      parameters:
        - name: includeArchived
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Owned accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createAccount
      summary: Create an account and optionally post its opening balance atomically
      tags: [Cashflow]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/accounts/{accountId}:
    patch:
      operationId: updateAccount
      summary: Rename, archive, restore, or change an unused account currency
      tags: [Cashflow]
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountRequest"
      responses:
        "200":
          description: Account updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/categories:
    get:
      operationId: listCategories
      summary: List owned income and expense categories
      tags: [Cashflow]
      parameters:
        - name: includeArchived
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Owned categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createCategory
      summary: Create a category and its private ledger account atomically
      tags: [Cashflow]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/categories/{categoryId}:
    patch:
      operationId: updateCategory
      summary: Rename, archive, or restore an owned category
      tags: [Cashflow]
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryRequest"
      responses:
        "200":
          description: Category updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/transactions:
    get:
      operationId: listTransactions
      summary: List immutable operations using stable cursor pagination
      tags: [Cashflow]
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: accountId
          in: query
          schema:
            type: string
            format: uuid
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/TransactionType"
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 200
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Immutable operation page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createTransaction
      summary: Post one typed financial operation as a balanced transaction
      tags: [Cashflow]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransactionRequest"
      responses:
        "201":
          description: Operation posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/transactions/{transactionId}/reversal:
    post:
      operationId: reverseTransaction
      summary: Preserve and reverse an owned posted transaction
      tags: [Cashflow]
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReversalRequest"
      responses:
        "201":
          description: Reversal posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/transactions/{transactionId}/replacement:
    post:
      operationId: replaceTransaction
      summary: Atomically reverse an operation and post its corrected replacement
      tags: [Cashflow]
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplacementRequest"
      responses:
        "201":
          description: Original reversed and corrected operation posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplacementResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TransactionId:
      name: transactionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Authentication or credential verification failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Resource state conflicts with the request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Owned resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: Too many attempts
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: Required dependency unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
        version:
          type: string
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, displayName, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        password:
          $ref: "#/components/schemas/Password"
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 8
          maxLength: 128
    TOTPLoginRequest:
      type: object
      additionalProperties: false
      required: [challengeToken, code]
      properties:
        challengeToken:
          type: string
          minLength: 40
          maxLength: 100
        code:
          type: string
          pattern: "^[0-9]{6}$"
    RecoveryLoginRequest:
      type: object
      additionalProperties: false
      required: [challengeToken, recoveryCode]
      properties:
        challengeToken:
          type: string
          minLength: 40
          maxLength: 100
        recoveryCode:
          type: string
          minLength: 16
          maxLength: 32
    LoginChallengeResponse:
      type: object
      additionalProperties: false
      required: [status, challengeToken, expiresInSeconds]
      properties:
        status:
          type: string
          const: totp_required
        challengeToken:
          type: string
        expiresInSeconds:
          type: integer
          minimum: 1
    AuthResponse:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
    User:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - displayName
        - timezone
        - functionalCurrency
        - displayCurrency
        - reconciliationMode
        - onboardingCompleted
        - totpEnabled
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        timezone:
          type: string
        functionalCurrency:
          $ref: "#/components/schemas/Currency"
        displayCurrency:
          $ref: "#/components/schemas/Currency"
        reconciliationMode:
          $ref: "#/components/schemas/ReconciliationMode"
        onboardingCompleted:
          type: boolean
        totpEnabled:
          type: boolean
    SessionListResponse:
      type: object
      additionalProperties: false
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"
    Session:
      type: object
      additionalProperties: false
      required: [id, createdAt, lastSeenAt, expiresAt, current]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        userAgent:
          type: string
        current:
          type: boolean
    TOTPSetupResponse:
      type: object
      additionalProperties: false
      required: [secret, provisioningUri]
      properties:
        secret:
          type: string
        provisioningUri:
          type: string
          format: uri
    TOTPConfirmRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          pattern: "^[0-9]{6}$"
    TOTPConfirmResponse:
      type: object
      additionalProperties: false
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
    TOTPDisableRequest:
      type: object
      additionalProperties: false
      required: [password, code]
      properties:
        password:
          type: string
          minLength: 8
          maxLength: 128
        code:
          type: string
          pattern: "^[0-9]{6}$"
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      required: [email, displayName]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        currentPassword:
          type: string
          maxLength: 128
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 8
          maxLength: 128
        newPassword:
          $ref: "#/components/schemas/Password"
    UpdateUserSettingsRequest:
      type: object
      additionalProperties: false
      required: [timezone, functionalCurrency, displayCurrency, reconciliationMode]
      properties:
        timezone:
          type: string
          minLength: 1
          maxLength: 100
        functionalCurrency:
          $ref: "#/components/schemas/Currency"
        displayCurrency:
          $ref: "#/components/schemas/Currency"
        reconciliationMode:
          $ref: "#/components/schemas/ReconciliationMode"
    DeleteAccountRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          minLength: 8
          maxLength: 128
    CompleteOnboardingRequest:
      type: object
      additionalProperties: false
      required:
        - timezone
        - functionalCurrency
        - displayCurrency
        - reconciliationMode
        - account
      properties:
        timezone:
          type: string
          minLength: 1
          maxLength: 100
        functionalCurrency:
          $ref: "#/components/schemas/Currency"
        displayCurrency:
          $ref: "#/components/schemas/Currency"
        reconciliationMode:
          $ref: "#/components/schemas/ReconciliationMode"
        account:
          $ref: "#/components/schemas/OnboardingAccount"
        recurringIncome:
