name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: myfinance
          POSTGRES_PASSWORD: myfinance
          POSTGRES_DB: myfinance_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U myfinance -d myfinance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://myfinance:myfinance@localhost:5433/myfinance_test
      DATABASE_URL_TEST: postgresql://myfinance:myfinance@localhost:5433/myfinance_test
      NODE_ENV: test
      TOTP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:test:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:workspaces
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate

  smoke:
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: myfinance
          POSTGRES_PASSWORD: myfinance
          POSTGRES_DB: myfinance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myfinance -d myfinance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://myfinance:myfinance@localhost:5432/myfinance
      TOTP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:deploy
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
